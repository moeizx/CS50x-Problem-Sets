{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center;">Edit Trade</h2>

<div style="
    display:flex;
    justify-content:center;
    margin-top:25px;
">

    <form method="POST" autocomplete="off" style="
        width:100%;
        max-width:600px;
        background:#111827;
        padding:28px;
        border-radius:12px;
        border:1px solid #1f2937;
        box-sizing:border-box;
    ">

        <!-- autofill off -->
        <input type="text" name="fakeusernameremembered" style="display:none;">
        <input type="password" name="fakepasswordremembered" style="display:none;">

        <!-- pair -->
        <div style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px;">Pair</label>
            <input type="text" name="pair" value="{{ trade.pair }}"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
            ">
        </div>

        <!-- entry/exit -->
        <div style="display:flex; gap:14px; margin-bottom:14px;">

            <div style="flex:1;">
                <label style="display:block; margin-bottom:6px;">Entry Price</label>
                <input type="number" step="0.0001" name="entry_price" value="{{ trade.entry_price }}"
                style="
                    width:100%;
                    padding:10px;
                    background:#0b1220;
                    border:1px solid #1f2937;
                    color:white;
                    border-radius:8px;
                    box-sizing:border-box;
                ">
            </div>

            <div style="flex:1;">
                <label style="display:block; margin-bottom:6px;">Exit Price</label>
                <input type="number" step="0.0001" name="exit_price" value="{{ trade.exit_price }}"
                style="
                    width:100%;
                    padding:10px;
                    background:#0b1220;
                    border:1px solid #1f2937;
                    color:white;
                    border-radius:8px;
                    box-sizing:border-box;
                ">
            </div>

        </div>

        <!-- lot size -->
        <div style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px;">Lot Size</label>
            <input type="number" step="0.01" name="lot_size" value="{{ trade.lot_size }}"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
            ">
        </div>

        <!-- trade type -->
        <div style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px;">Trade Type</label>
            <select name="trade_type"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
            ">
                <option value="Buy" {% if trade.trade_type == "Buy" %}selected{% endif %}>Buy</option>
                <option value="Sell" {% if trade.trade_type == "Sell" %}selected{% endif %}>Sell</option>
            </select>
        </div>

        <!-- strategy -->
        <div style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px;">Strategy</label>
            <input type="text" name="strategy" value="{{ trade.strategy }}"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
            ">
        </div>

        <!-- emotion -->
        <div style="margin-bottom:14px;">
            <label style="display:block; margin-bottom:6px;">Emotion</label>
            <input type="text" name="emotion" value="{{ trade.emotion }}"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
            ">
        </div>

        <!-- notes -->
        <div style="margin-bottom:18px;">
            <label style="display:block; margin-bottom:6px;">Notes</label>
            <textarea name="notes" rows="4"
            style="
                width:100%;
                padding:10px;
                background:#0b1220;
                border:1px solid #1f2937;
                color:white;
                border-radius:8px;
                box-sizing:border-box;
                resize:none;
            ">{{ trade.notes }}</textarea>
        </div>

        <!-- buttons -->
        <div style="display:flex; gap:10px;">
            <button type="submit" style="
                flex:1;
                padding:12px;
                background:#2563eb;
                border:none;
                border-radius:8px;
                color:white;
                font-weight:bold;
                cursor:pointer;
            ">
                Update Trade
            </button>

            <a href="/history" style="
                flex:1;
                text-align:center;
                padding:12px;
                background:#1f2937;
                border-radius:8px;
                color:white;
                text-decoration:none;
            ">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
